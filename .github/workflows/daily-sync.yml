name: Daily Competition & Ladder Sync

on:
  schedule:
    # Runs everyday at 20:00 UTC (6:00 AM AEST / Brisbane time)
    - cron: '0 20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.git_check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recalculate & Sync Ladder
        run: npm run sync:ladder

      - name: Check for changes and commit
        id: git_check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/data/competition.ts)" ]; then
            git add src/data/competition.ts
            git commit -m "chore(cron): daily sync competition ladder and results [skip ci]"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in competition ladder today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build application
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
